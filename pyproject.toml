[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-risk-financial-intelligence"
version = "1.0.0"
description = "Integrated customer credit-tier assessment and bank financial forecasting platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
